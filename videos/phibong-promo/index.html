    <script>

      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-pain", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.6, ease: "power2.inOut" }, 5.4);
        tl.fromTo("#el-02-brand", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.6, ease: "power2.inOut" }, 5.4);

        tl.fromTo("#el-03-route", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 10.2);
        tl.to("#el-03-route", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 19.8);
        tl.fromTo("#el-04-price", { x: 1920, opacity: 1 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 19.8);

        tl.to({}, { duration: 49.8 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
