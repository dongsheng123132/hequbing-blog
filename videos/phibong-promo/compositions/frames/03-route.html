  <script src="assets/vendor/MotionPathPlugin.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      gsap.registerPlugin(MotionPathPlugin);

      var byId = function (id) {
        return document.getElementById(id);
      };

      // Fixed geometry: same 1920x1080 pixel space as assets/map/points.json
      var ORIGIN = { x: 714.4, y: 252.2 }; // china-origin
      var MANILA = { x: 1163.5, y: 778 }; // manila
      var AIR_CTRL = { x: 1080, y: 330 }; // air-arc control point
      var PLANE_START_DEG = (Math.atan2(AIR_CTRL.y - ORIGIN.y, AIR_CTRL.x - ORIGIN.x) * 180) / Math.PI;
      var SHIP_END = 0.94; // ship parks at the Manila Bay entrance, clear of the destination dot
      var PLANE_END = 0.93; // plane parks just north of Manila, clear of the destination dot

      var camera = byId("f03-route-camera");
      var seaPath = byId("f03-route-sea");
      var seaReveal = byId("f03-route-sea-reveal");
      var airPath = byId("f03-route-air");
      var originRing = byId("f03-route-origin-ring");
      var originDot = byId("f03-route-origin-dot");
      var manilaRing = byId("f03-route-manila-ring");
      var manilaDot = byId("f03-route-manila-dot");
      var manilaGlow = byId("f03-route-manila-glow");
      var pulseA = byId("f03-route-pulse-a");
      var pulseB = byId("f03-route-pulse-b");
      var pulseC = byId("f03-route-pulse-c");
      var ship = byId("f03-route-ship");
      var plane = byId("f03-route-plane");
      var chipOrigin = byId("f03-route-chip-origin");
      var chipManila = byId("f03-route-chip-manila");
      var cardSea = byId("f03-route-card-sea");
      var cardAir = byId("f03-route-card-air");
      var iconSea = byId("f03-route-icon-sea");
      var iconAir = byId("f03-route-icon-air");
      var labelSea = byId("f03-route-label-sea");
      var labelAir = byId("f03-route-label-air");
      var subSea = byId("f03-route-sub-sea");
      var subAir = byId("f03-route-sub-air");
      var numSea = byId("f03-route-num-sea");
      var numAir = byId("f03-route-num-air");
      var suffixSea = byId("f03-route-suffix-sea");
      var suffixAir = byId("f03-route-suffix-air");
      var pill = byId("f03-route-pill");

      // svg-path-draw setup: measured lengths, one dash = whole path, shifted fully out.
      // Sea: the dashed route is revealed through a solid mask stroke so its dash pattern stays intact.
      var seaLen = Math.ceil(seaReveal.getTotalLength() || 734) + 2;
      var airLen = Math.ceil(airPath.getTotalLength() || 739) + 2;
      seaReveal.style.strokeDasharray = seaLen + " " + seaLen;
      seaReveal.style.strokeDashoffset = String(seaLen);
      airPath.style.strokeDasharray = airLen + " " + airLen;
      airPath.style.strokeDashoffset = String(airLen);

      // Transform origins pinned to the map points (seek-safe, no bbox dependency for markers)
      gsap.set([originRing, originDot], { svgOrigin: ORIGIN.x + " " + ORIGIN.y });
      gsap.set([manilaRing, manilaDot, manilaGlow, pulseA, pulseB, pulseC], { svgOrigin: MANILA.x + " " + MANILA.y });
      // Vehicles are centred on their own (0,0); park them on the origin until their ride starts
      gsap.set(ship, { x: ORIGIN.x, y: ORIGIN.y, transformOrigin: "50% 50%" });
      gsap.set(plane, { x: ORIGIN.x, y: ORIGIN.y, rotation: PLANE_START_DEG, transformOrigin: "50% 50%" });

      var tl = gsap.timeline({ paused: true });

      function pop(target, at, dur) {
        tl.fromTo(target, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: dur || 0.5, ease: "power3.out" }, at);
      }

      // counting-dynamic-scale: value + scale share start, duration and ease
      function countUp(numEl, target, at, dur) {
        var state = { v: 0 };
        tl.fromTo(
          state,
          { v: 0 },
          {
            v: target,
            duration: dur,
            ease: "power2.out",
            onUpdate: function () {
              numEl.textContent = String(Math.round(state.v));
            },
          },
          at
        );
        tl.fromTo(numEl, { scale: 0.5 }, { scale: 1, duration: dur, ease: "power2.out" }, at);
      }

      // ── Scene 1 (0.0–1.2): land settles in full-bleed; origin marked ──
      tl.fromTo(camera, { opacity: 0, scale: 1.03 }, { opacity: 1, scale: 1, duration: 1.2, ease: "power2.out" }, 0);
      pop(originRing, 0.3, 0.5);
      pop(originDot, 0.36, 0.45);
      pop(chipOrigin, 0.6, 0.5);

      // ── Scene 2 (1.2–2.4): destination pops with a finite pulsing ring ──
      pop(manilaRing, 1.2, 0.5);
      pop(manilaDot, 1.26, 0.45);
      tl.fromTo(chipManila, { scale: 0, opacity: 0, x: -10 }, { scale: 1, opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 1.5);
      [pulseA, pulseB, pulseC].forEach(function (ring, i) {
        var at = 1.35 + i * 0.6;
        tl.fromTo(ring, { scale: 1, opacity: 0 }, { scale: 1.3, opacity: 0.55, duration: 0.15, ease: "none" }, at);
        tl.to(ring, { scale: 2.7, opacity: 0, duration: 1.05, ease: "power2.out" }, at + 0.15);
      });

      // ── Scene 3 (2.4–5.4): sea route draws, ship rides it; card 1 lands ──
      tl.fromTo(cardSea, { opacity: 0, y: 28, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "power3.out" }, 2.4);
      tl.fromTo(ship, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, 2.4);
      pop(iconSea, 2.55, 0.45);
      tl.fromTo(labelSea, { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" }, 2.6);
      tl.fromTo(seaReveal, { strokeDashoffset: seaLen }, { strokeDashoffset: 0, duration: 2.4, ease: "power1.inOut" }, 2.7);
      tl.to(
        ship,
        {
          motionPath: { path: seaPath, align: seaPath, alignOrigin: [0.5, 0.5], end: SHIP_END },
          duration: 2.4,
          ease: "power1.inOut",
        },
        2.7
      );
      countUp(numSea, 15, 2.7, 2.4);
      tl.fromTo(subSea, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 3.0);
      tl.fromTo(suffixSea, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.6)" }, 5.1);

      // ── Scene 4 (5.4–8.4): air arc draws, plane flies it nose-first; card 2 lands ──
      tl.fromTo(cardAir, { opacity: 0, y: 28, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "power3.out" }, 5.4);
      tl.fromTo(plane, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, 5.4);
      pop(iconAir, 5.55, 0.45);
      tl.fromTo(labelAir, { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" }, 5.6);
      tl.fromTo(airPath, { strokeDashoffset: airLen }, { strokeDashoffset: 0, duration: 2.4, ease: "power1.inOut" }, 5.7);
      tl.to(
        plane,
        {
          motionPath: { path: airPath, align: airPath, alignOrigin: [0.5, 0.5], autoRotate: true, end: PLANE_END },
          duration: 2.4,
          ease: "power1.inOut",
        },
        5.7
      );
      countUp(numAir, 3, 5.7, 2.4);
      tl.fromTo(subAir, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 6.0);
      tl.fromTo(suffixAir, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.6)" }, 8.1);

      // ── Scene 5 (8.4–9.6): pill springs in; Manila blooms once, then hold ──
      tl.fromTo(pill, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" }, 8.4);
      tl.fromTo(manilaGlow, { opacity: 0, scale: 0.8 }, { opacity: 0.42, scale: 1.06, duration: 0.6, ease: "power2.out" }, 8.55);
