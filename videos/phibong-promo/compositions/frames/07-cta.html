<template>
  <style>
    @font-face{font-family:"Noto Sans SC";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/NotoSansSC-Regular.woff2") format("woff2");}
    @font-face{font-family:"Noto Sans SC";font-weight:500;font-style:normal;font-display:block;src:url("assets/fonts/NotoSansSC-Medium.woff2") format("woff2");}
    @font-face{font-family:"Noto Sans SC";font-weight:700;font-style:normal;font-display:block;src:url("assets/fonts/NotoSansSC-Bold.woff2") format("woff2");}
    @font-face{font-family:"Noto Sans SC";font-weight:900;font-style:normal;font-display:block;src:url("assets/fonts/NotoSansSC-Black.woff2") format("woff2");}

    #root {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      font-family: "Noto Sans SC", sans-serif;
      color: #111111;
    }

    /* Full-bleed cream ground — a full-duration clip, never painted on #root */
    [id="07-cta-ground"] {
      position: absolute;
      inset: 0;
      background: #fdfae7;
      z-index: 0;
    }

    /* Frame container — every frame-relative unit resolves against it (cqw / cqh) */
    [id="07-cta-stage"] {
      position: absolute;
      inset: 0;
      container-type: size;
      z-index: 1;
    }

    /* Two stacked cards; the Scene 1 -> Scene 2 hard cut is an instant opacity swap */
    [id="07-cta-card1"],
    [id="07-cta-card2"] {
      position: absolute;
      inset: 0;
    }
    [id="07-cta-card2"] {
      opacity: 0;
    }

    /* Content region = top 83% of the canvas (0–900px); everything centers inside it */
    [id="07-cta-statement"],
    [id="07-cta-lockup"] {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 83.333cqh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    /* ---- Card 1 · statement ---- */
    [id="07-cta-s1"],
    [id="07-cta-s2"] {
      font-size: 6.2cqw;
      font-weight: 900;
      line-height: 1.2;
      letter-spacing: -0.02em;
      white-space: nowrap;
      will-change: transform, opacity;
    }
    [id="07-cta-s1"] {
      color: #111111;
    }
    [id="07-cta-s2"] {
      margin-top: 0.4cqw;
    }
    /* gradient-text-sweep · one-pass sheen: cobalt rest fill, one lighter-cobalt band */
    [id="07-cta-s2-fill"] {
      display: inline-block;
      color: transparent;
      background-image: linear-gradient(
        100deg,
        #1e2bfa 0%,
        #1e2bfa 42%,
        #7d85ff 50%,
        #1e2bfa 58%,
        #1e2bfa 100%
      );
      background-size: 300% 100%;
      background-position: 100% 50%;
      -webkit-background-clip: text;
      background-clip: text;
    }

    /* ---- Card 2 · end card ---- */
    /* Concentric closing rings (atmosphere), halo around the lockup, kept inside 0–900px */
    [id="07-cta-rings"] {
      position: absolute;
      left: 50%;
      top: 450px;
      width: 860px;
      height: 860px;
      margin-left: -430px;
      margin-top: -430px;
      opacity: 0.7;
      transform-origin: 50% 50%;
      pointer-events: none;
      will-change: transform, opacity;
    }
    [id="07-cta-rings"] > span {
      position: absolute;
      box-sizing: border-box;
      border: 1.5px solid rgba(30, 43, 250, 0.2);
      border-radius: 50%;
    }
    [id="07-cta-rings"] > span:nth-child(1) {
      inset: 80px; /* 700px */
      opacity: 1;
    }
    [id="07-cta-rings"] > span:nth-child(2) {
      inset: 40px; /* 780px */
      opacity: 0.7;
    }
    [id="07-cta-rings"] > span:nth-child(3) {
      inset: 0; /* 860px */
      opacity: 0.45;
    }

    [id="07-cta-rule"] {
      width: 60px;
      height: 4px;
      border-radius: 2px;
      background: #1e2bfa;
      margin-bottom: 2cqw;
    }
    [id="07-cta-name"] {
      font-size: 5cqw;
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: #111111;
      white-space: nowrap;
    }
    [id="07-cta-sub"] {
      margin-top: 1.3cqw;
      font-size: 1.6cqw;
      font-weight: 500;
      line-height: 1.4;
      letter-spacing: 0.06em;
      color: #6b6b6b;
      white-space: nowrap;
    }
    /* cta-button — the one solid cobalt element */
    [id="07-cta-url"] {
      margin-top: 3cqw;
      display: inline-block;
      padding: 0.62em 1.5em;
      border-radius: 100px;
      background: #1e2bfa;
      color: #fdfae7;
      font-size: 2cqw;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: 0.01em;
      white-space: nowrap;
      transform-origin: 50% 50%;
      will-change: transform, opacity;
    }
  </style>

  <div id="root" data-composition-id="07-cta" data-width="1920" data-height="1080">
    <div
      id="07-cta-ground"
      class="clip"
      data-start="0"
      data-duration="7.2"
      data-track-index="0"
    ></div>

    <div id="07-cta-stage">
      <!-- Card 1 · statement (Scene 1, 0.0–2.4s) -->
      <div id="07-cta-card1">
        <div id="07-cta-statement">
          <div id="07-cta-s1">中国发菲律宾</div>
          <div id="07-cta-s2"><span id="07-cta-s2-fill">就找菲邦</span></div>
        </div>
      </div>

      <!-- Card 2 · end card (Scenes 2–3, 2.4–7.2s) -->
      <div id="07-cta-card2">
        <div id="07-cta-rings"><span></span><span></span><span></span></div>
        <div id="07-cta-lockup">
          <div id="07-cta-rule"></div>
          <div id="07-cta-name">菲邦国际物流</div>
          <div id="07-cta-sub">PHIBONG · 中国 → 菲律宾专线物流</div>
          <div id="07-cta-url">www.phibong.com</div>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });
    const byId = (id) => document.getElementById(id);

    const card1 = byId("07-cta-card1");
    const card2 = byId("07-cta-card2");
    const s1 = byId("07-cta-s1");
    const s2 = byId("07-cta-s2");
    const s2Fill = byId("07-cta-s2-fill");
    const rings = byId("07-cta-rings");
    const url = byId("07-cta-url");

    // 100 BPM grid — beat = 0.6s. Scene windows: 0.0–2.4 / 2.4–4.8 / 4.8–7.2.

    // Scene 1 (0.0–2.4s): statement card — one slide-up crossfade brings the two lines to center.
    tl.fromTo(s1, { opacity: 0, y: 56 }, { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" }, 0.05);
    tl.fromTo(s2, { opacity: 0, y: 56 }, { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" }, 0.17);
    // Hold (beat 2 → cut): one-pass sheen travels left→right inside the cobalt line; glyphs never move.
    tl.fromTo(
      s2Fill,
      { backgroundPosition: "100% 50%" },
      { backgroundPosition: "0% 50%", duration: 1.2, ease: "none" },
      1.2,
    );

    // Scene 2 (2.4s): instant hard cut at full opacity — statement card out, end card in.
    tl.set(card1, { opacity: 0 }, 2.4);
    tl.set(card2, { opacity: 1 }, 2.4);
    // Barely-perceptible continuous drift on the closing rings across the end-card hold.
    tl.fromTo(rings, { scale: 1 }, { scale: 1.03, duration: 4.8, ease: "none" }, 2.4);
    // Next beat (3.0s): the solid cobalt URL pill springs in beneath the lockup (spring-pop-entrance, calm settle).
    tl.fromTo(
      url,
      { scale: 0, opacity: 0, y: 10 },
      { scale: 1, opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
      3.0,
    );

    // Scene 3 (4.8–7.2s): hold the end card; final settle fades the rings only in the last 0.6s.
    tl.fromTo(rings, { opacity: 0.7 }, { opacity: 0, duration: 0.6, ease: "power1.inOut" }, 6.6);

    window.__timelines = window.__timelines || {};
    window.__timelines["07-cta"] = tl;
  </script>
</template>
