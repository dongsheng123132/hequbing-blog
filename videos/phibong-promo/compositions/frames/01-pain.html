  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // One tempo grid drives every onset: 100 BPM, beat = 0.6s.
      const BEAT = 0.6;
      const THIRD = BEAT / 3; // strike stagger (one beat-third)
      const CUT = 0.01; // hard cut: the outgoing beat vanishes one tick after the incoming onset (no blank frame)
      const DURATION = 5.4;
      const T = {
        open: 0,
        question: BEAT * 1, // 0.6
        pain1: BEAT * 2, // 1.2
        pain2: BEAT * 4, // 2.4
        pain3: BEAT * 6, // 3.6
        stack: BEAT * 7, // 4.2
        strike: BEAT * 8, // 4.8
      };
      // Straight strokes: length = x2 - x1 of the authored line; hidden offset = length + stroke width.
      const K4 = 410;
      const K5 = 508;
      const SW = 14;

      // Camera: slow uniform push running under the whole sequence.
      tl.fromTo("#f01-pain-cam", { scale: 1 }, { scale: 1.03, duration: DURATION, ease: "none" }, 0);

      // Scene 1 (0.0–1.2): accent line + eyebrow, then the question slams in on the next beat.
      tl.fromTo(
        "#f01-pain-rule",
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        T.open,
      );
      tl.fromTo(
        "#f01-pain-eyebrow",
        { y: 18, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        T.open + 0.06,
      );
      tl.fromTo(
        "#f01-pain-q",
        { scale: 1.15, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power4.out" },
        T.question,
      );

      // Scene 2 (1.2–2.4): hard cut — 清关卡住 slams in alone (scale + blur slam).
      tl.set("#f01-pain-s1", { opacity: 0 }, T.pain1 + CUT);
      tl.fromTo(
        "#f01-pain-p1",
        { scale: 1.3, opacity: 0, filter: "blur(10px)" },
        { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.45, ease: "power4.out" },
        T.pain1,
      );
      tl.fromTo(
        "#f01-pain-ticks",
        { opacity: 0 },
        { opacity: 1, duration: 0.15, ease: "power1.out" },
        T.pain1,
      );
      tl.fromTo(
        "#f01-pain-t1",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.3, ease: "power3.out" },
        T.pain1 + 0.1,
      );

      // Scene 3 (2.4–3.6): hard cut — 价格说不清, same slot, slam with a side snap.
      tl.set("#f01-pain-l1", { opacity: 0 }, T.pain2 + CUT);
      tl.fromTo(
        "#f01-pain-p2",
        { x: -90, scale: 1.18, opacity: 0, filter: "blur(10px)" },
        { x: 0, scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "expo.out" },
        T.pain2,
      );
      tl.fromTo(
        "#f01-pain-t2",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.3, ease: "power3.out" },
        T.pain2 + 0.1,
      );

      // Scene 4 (3.6–4.2): hard cut — 时效没个准, same slot, slam with a heavy rise.
      tl.set("#f01-pain-l2", { opacity: 0 }, T.pain3 + CUT);
      tl.fromTo(
        "#f01-pain-p3",
        { y: 70, rotation: -3, scale: 1.18, opacity: 0 },
        { y: 0, rotation: 0, scale: 1, opacity: 1, duration: 0.4, ease: "circ.out" },
        T.pain3,
      );
      tl.fromTo(
        "#f01-pain-t3",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.3, ease: "power3.out" },
        T.pain3 + 0.1,
      );

      // Scene 5 (4.2–5.4): the three return together as a compact stack (pull-back arrival)...
      tl.set("#f01-pain-l3", { opacity: 0 }, T.stack + CUT);
      tl.set("#f01-pain-ticks", { opacity: 0 }, T.stack + CUT);
      tl.fromTo(
        "#f01-pain-stack",
        { scale: 1.25, opacity: 0, filter: "blur(10px)" },
        { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" },
        T.stack,
      );

      // ...then on the next beat one cobalt stroke crosses out each line in turn (svg-path-draw).
      tl.fromTo(
        "#f01-pain-k1",
        { strokeDashoffset: K4 + SW },
        { strokeDashoffset: 0, duration: 0.26, ease: "power2.out" },
        T.strike,
      );
      tl.fromTo(
        "#f01-pain-k2",
        { strokeDashoffset: K5 + SW },
        { strokeDashoffset: 0, duration: 0.26, ease: "power2.out" },
        T.strike + THIRD,
      );
      tl.fromTo(
        "#f01-pain-k3",
        { strokeDashoffset: K5 + SW },
        { strokeDashoffset: 0, duration: 0.16, ease: "power2.out" },
        T.strike + THIRD * 2,
      );
      // Each struck line recedes one step down the gray ladder as its stroke passes.
      tl.fromTo(
        "#f01-pain-r1",
        { color: "#6b6b6b" },
        { color: "#9a9a9a", duration: 0.24, ease: "power1.out" },
        T.strike + 0.04,
      );
      tl.fromTo(
        "#f01-pain-r2",
        { color: "#6b6b6b" },
        { color: "#9a9a9a", duration: 0.24, ease: "power1.out" },
        T.strike + THIRD + 0.04,
      );
      tl.fromTo(
        "#f01-pain-r3",
        { color: "#6b6b6b" },
        { color: "#9a9a9a", duration: 0.16, ease: "power1.out" },
        T.strike + THIRD * 2 + 0.02,
      );

      window.__timelines["01-pain"] = tl;
    })();
