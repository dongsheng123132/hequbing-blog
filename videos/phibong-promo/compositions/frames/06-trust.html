    [id="f06-trust-num"] {

      text-align: left;
      font-variant-numeric: tabular-nums;

    }
    [id="f06-trust-pct"] {

    [id="f06-trust-label"] {
      font-size: 32px;
      font-weight: 500;
      line-height: 1.3;
      color: #111111;
      white-space: nowrap;
    }
  </style>

  <div id="root" data-composition-id="06-trust" data-start="0" data-duration="7.7" data-width="1920" data-height="1080">
    <div id="f06-trust-bg" class="clip" data-start="0" data-duration="7.7" data-track-index="0"></div>

    <div id="f06-trust-scene" class="clip" data-start="0" data-duration="7.7" data-track-index="1">
      <div id="f06-trust-camera">
        <svg id="f06-trust-wires" viewBox="0 0 1920 1080" width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
          <circle id="f06-trust-halo" cx="960" cy="460" r="150" />
          <!-- orbit ring: clockwise from 12 o'clock -->
          <path id="f06-trust-ring" d="M960 310 A150 150 0 1 1 960 610 A150 150 0 1 1 960 310" />
          <!-- connectors: ring point (45° diagonals) → card port -->
          <path id="f06-trust-wire-1" class="f06-trust-wire" d="M853.93 353.93 L710 210" />

          <path id="f06-trust-wire-3" class="f06-trust-wire" d="M1066.07 566.07 L1210 710" />
          <path id="f06-trust-wire-4" class="f06-trust-wire" d="M853.93 566.07 L710 710" />
        </svg>

        <!-- card 1 · top-left -->
        <div id="f06-trust-card-1" class="f06-trust-card f06-trust-card-l" style="left: 150px; top: 110px">
          <div class="f06-trust-badge">
            <svg id="f06-trust-icon-1" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="19"/><path d="M15 24.5l6 6 12-13"/></svg>
          </div>

            <div id="f06-trust-stat"><span id="f06-trust-num">0</span><span id="f06-trust-pct">%</span></div>

          <div class="f06-trust-badge">
            <svg id="f06-trust-icon-2" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M24 44s14-12.5 14-24a14 14 0 0 0-28 0c0 11.5 14 24 14 24z"/><circle cx="24" cy="20" r="5"/></svg>

          </div>
          <div class="f06-trust-txt">

        <!-- ring nodes (connector starts) -->
        <div id="f06-trust-rdot-1" class="f06-trust-rdot" style="left: 853.93px; top: 353.93px"></div>
        <div id="f06-trust-rdot-2" class="f06-trust-rdot" style="left: 1066.07px; top: 353.93px"></div>

        <!-- card ports (connector ends, on each card's inner edge) -->

  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var P = "f06-trust-";
      function el(id) {
        return document.getElementById(P + id);
      }

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var TOTAL = 7.2;
      var POP = "power3.out";

      // spring-pop-entrance: scale 0 -> 1, smooth long-tail settle, fromTo (seek-safe)
      function pop(target, at, dur) {
        tl.fromTo(
          target,
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: dur, ease: POP },
          at,
        );
      }
      // small fade-rise for text rows inside a card
      function rise(target, at) {
        tl.fromTo(
          target,
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.45, ease: POP },
          at,
        );
      }
      // svg-path-draw: measured length; gap padded past the cap so nothing leaks before the draw
      function drawStroke(target, fallbackLen, at, dur) {
        var len = 0;
        try {
          len = target.getTotalLength();
        } catch (e) {
          len = 0;
        }
        if (!(len > 0)) len = fallbackLen;
        var pad = 6;
        target.style.strokeDasharray = len + " " + (len + pad * 2);
        tl.fromTo(
          target,
          { strokeDashoffset: len + pad },
          { strokeDashoffset: 0, duration: dur, ease: "power2.out" },
          at,
        );
      }

      // ---------- Scene 1 (0.0–1.2s): hub springs in, orbit ring draws ----------
      pop(el("hub"), 0.05, 0.6);
      tl.fromTo(
        el("hubtext"),
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.5, ease: POP },
        0.25,
      );
      drawStroke(el("ring"), 2 * Math.PI * 150, 0.3, 0.8);
      tl.fromTo(
        el("halo"),
        { opacity: 0 },
        { opacity: 1, duration: 0.6, ease: "power1.out" },
        0.6,
      );

      // ---------- Scene 2 (1.2–4.8s): four guarantee cards, one per 0.9s, clockwise from top-left ----------
      var SLOT_AT = 1.2;
      var SLOT = 0.9;
      var WIRE_LEN = 144 * Math.SQRT2;
      for (var i = 0; i < 4; i++) {
        var n = i + 1;
        var T = SLOT_AT + i * SLOT;

        pop(el("rdot-" + n), T, 0.3);
        drawStroke(el("wire-" + n), WIRE_LEN, T, 0.4);
        pop(el("card-" + n), T + 0.22, 0.6);
        pop(el("pdot-" + n), T + 0.32, 0.3);

        var shapes = el("icon-" + n).querySelectorAll("path, circle");
        for (var j = 0; j < shapes.length; j++) {
          drawStroke(shapes[j], 200, T + 0.42 + j * 0.12, 0.5);
        }

        if (n > 1) {
          rise(el("r1-" + n), T + 0.42);
          rise(el("r2-" + n), T + 0.54);
        }
      }

      // counting-dynamic-scale on card 1: 0 -> 99, scale 0.5 -> 1 (same timing + ease), % after it lands
      var COUNT_AT = 1.45;
      var COUNT_DUR = 1.25;
      var numEl = el("num");
      var count = { v: 0 };
      tl.fromTo(
        count,
        { v: 0 },
        {
          v: 99,
          duration: COUNT_DUR,
          ease: "power3.out",
          onUpdate: function () {
            numEl.textContent = String(Math.round(count.v));
          },
        },
        COUNT_AT,
      );
      tl.fromTo(
        numEl,
        { scale: 0.5 },
        { scale: 1, duration: COUNT_DUR, ease: "power3.out" },
        COUNT_AT,
      );
      rise(el("label"), SLOT_AT + 0.5);
      tl.fromTo(
        el("pct"),
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.6)" },
        COUNT_AT + COUNT_DUR,
      );

      // ---------- Scene 3 (4.8–7.2s): multi-phase camera — hold 1.00, push to 1.04 on the hub, then still ----------
      // One writer. Scale + micro-drift are pure functions of the writer's own time (seek-safe, no cross-tween reads);
      // the drift decays to zero as the push lands, so the end is a true still hold.
      var cam = el("camera");
      var PUSH_AT = 4.8;
      var PUSH_DUR = 1.8;
      var PUSH_TO = 1.04;
      var pushEase = gsap.parseEase("power2.inOut");
      var camT = { t: 0 };
      function writeCamera() {
        var t = camT.t;
        var k = Math.min(1, Math.max(0, (t - PUSH_AT) / PUSH_DUR));
        var s = 1 + (PUSH_TO - 1) * pushEase(k);
        var env = 1 - k;
        var p = (t / TOTAL) * Math.PI * 2;
        var dx = Math.sin(p) * 3 * env;
        var dy = Math.sin(p * 1.3) * 1.5 * env;
        cam.style.transform =
          "translate(" + dx.toFixed(3) + "px, " + dy.toFixed(3) + "px) scale(" + s.toFixed(5) + ")";
      }
      tl.fromTo(
        camT,
        { t: 0 },
        { t: TOTAL, duration: TOTAL, ease: "none", onUpdate: writeCamera },
        0,
      );
      writeCamera();

      window.__timelines["06-trust"] = tl;
    })();
  </script>
