  <script>
    (function () {
      var scope = document.querySelector('[data-composition-id="05-process"]') || document;
      function one(sel) {
        return scope.querySelector(sel);
      }
      function all(sel) {
        return Array.prototype.slice.call(scope.querySelectorAll(sel));
      }

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      var F = 1 / 60;

      // Geometry mirrored from the CSS — fixed positions, no runtime layout measurement.
      var LINE_X0 = 96; // track path start (px)
      var LINE_X1 = 1824; // track path end (px)
      var NODE_X0 = 240; // node 01 centre
      var NODE_GAP = 288; // even column pitch
      var LINE_START = 1.2; // Scene 2 opens
      var LINE_DUR = 4.8; // Scene 2 closes at 6.0
      var SPEED = (LINE_X1 - LINE_X0) / LINE_DUR; // 360 px/s, linear draw
      function reachAt(x) {
        return LINE_START + (x - LINE_X0) / SPEED; // node i -> 1.6 + 0.8·i
      }
      var LADDER = [1, 0.85, 0.7, 0.55]; // step-circle opacity ladder (frame.md)

      // waterfall-entry: binary reveal + whip up from below, power4.out
      function whip(el, at, dy, dur) {
        tl.set(el, { opacity: 1, y: dy }, at);
        tl.to(el, { y: 0, duration: dur, ease: "power4.out" }, at);
      }

      // svg-path-draw: dash = measured length (+pad so round caps stay hidden)
      function prepDraw(el, pad) {
        var len = el.getTotalLength();
        var dash = len + pad;
        var hidden = dash + pad / 2;
        el.style.strokeDasharray = dash + "px " + dash + "px";
        el.style.strokeDashoffset = hidden + "px";
        return hidden;
      }

      // ---- camera: slow push-in under the whole shot ----
      tl.fromTo(
        one("#f05-process-world"),
        { scale: 1 },
        { scale: 1.03, duration: 8.4, ease: "none" },
        0,
      );

      // ---- Scene 1 (0.0–1.2): header + empty track region ----
      tl.fromTo(
        one(".f05-process-accent"),
        { scaleX: 0 },
        { scaleX: 1, duration: 0.4, ease: "power2.out" },
        0.05,
      );
      whip(one("#f05-process-eyebrow"), 0.1, 40, 0.16);

      tl.fromTo(
        one(".f05-process-rail"),
        { opacity: 0 },
        { opacity: 1, duration: 0.5, ease: "power1.out" },
        0.1,
      );
      all(".f05-process-slot").forEach(function (slot, i) {
        tl.fromTo(
          slot,
          { scale: 0.6, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
          0.2 + i * 0.06,
        );
      });

      // h2 on the next beat (0.6): anchor travels furthest, pieces overlap by a frame
      var WORDS = [
        { dy: 72, dur: 0.18 },
        { dy: 48, dur: 0.15 },
        { dy: 48, dur: 0.15 },
        { dy: 64, dur: 0.16 },
      ];
      var tw = 0.6;
      all(".f05-process-w").forEach(function (el, i) {
        whip(el, tw, WORDS[i].dy, WORDS[i].dur);
        tw = tw + WORDS[i].dur - F;
      });

      // ---- Scene 2 (1.2–6.0): line draws L->R, nodes pop as it reaches them ----
      var track = one("#f05-process-track");
      var trackHidden = prepDraw(track, 0);
      tl.fromTo(
        track,
        { strokeDashoffset: trackHidden },
        { strokeDashoffset: 0, duration: LINE_DUR, ease: "none" },
        LINE_START,
      );
      tl.fromTo(
        one("#f05-process-dot-a"),
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        reachAt(LINE_X0),
      );

      var steps = all(".f05-process-step");
      var discs = all(".f05-process-disc");
      var counts = all(".f05-process-count");
      var labels = all(".f05-process-label");

      steps.forEach(function (step, i) {
        var tNode = reachAt(NODE_X0 + i * NODE_GAP);

        // spring-pop-entrance (smooth power3 settle, no overshoot)
        tl.fromTo(
          step,
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
          tNode,
        );

        // cream icon traces in inside the fresh circle (one gesture)
        Array.prototype.slice
          .call(step.querySelectorAll(".f05-process-ico path, .f05-process-ico circle"))
          .forEach(function (p) {
            var h = prepDraw(p, 4);
            tl.fromTo(
              p,
              { strokeDashoffset: h },
              { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },
              tNode + 0.1,
            );
          });

        // counter then label whip up (waterfall)
        whip(counts[i], tNode + 0.08, 28, 0.13);
        whip(labels[i], tNode + 0.08 + 0.13 - F, 44, 0.17);

        // earlier nodes step down the ladder; the newest stays full cobalt
        for (var j = 0; j < i; j++) {
          var d = i - j;
          if (d < LADDER.length) {
            tl.to(discs[j], { opacity: LADDER[d], duration: 0.3, ease: "power1.out" }, tNode);
          }
        }
      });

      tl.fromTo(
        one("#f05-process-dot-b"),
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        reachAt(LINE_X1),
      );

      // ---- Scene 3 (6.0–7.2): brackets over 03 & 05, shared pill, track pill ----
      var S3 = 6.0;
      all(".f05-process-brk").forEach(function (b) {
        var h = prepDraw(b, 4);
        tl.fromTo(
          b,
          { strokeDashoffset: h },
          { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
          S3,
        );
      });
      tl.to([discs[2], discs[4]], { opacity: 1, duration: 0.35, ease: "power1.out" }, S3);
      tl.fromTo(
        one("#f05-process-pill-a"),
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        S3 + 0.3,
      );
      tl.fromTo(
        one("#f05-process-pill-b"),
        { scale: 0, opacity: 0, y: 16 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        S3 + 0.6,
      );
      tl.to(
        [discs[0], discs[1], discs[3]],
        { opacity: 1, duration: 0.4, ease: "power1.out" },
        S3 + 0.6,
      );

      // ---- Scene 4 (7.2–8.4): hold (camera push continues underneath) ----

      window.__timelines["05-process"] = tl;
    })();
  </script>
