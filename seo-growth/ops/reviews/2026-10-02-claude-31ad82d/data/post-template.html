<!DOCTYPE html>
<!-- 文章页模板：由 api/render-post.js 在服务端填充 {{...}}，让爬虫和 AI 引擎不执行 JS 也能读到正文 -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{PAGE_TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}" id="meta-desc" />
  {{ROBOTS}}<link rel="canonical" href="{{URL}}" />
  <meta property="og:title" content="{{OG_TITLE}}" id="og-title" />
  <meta property="og:description" content="{{DESCRIPTION}}" id="og-desc" />
  <meta property="og:type" content="article" />
  <meta property="og:url" content="{{URL}}" id="og-url" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
  <script type="application/ld+json" id="schema-json">{{SCHEMA}}</script>
</head>
<body>
  <div id="post-progress" class="post-progress"></div>

  <header class="site-header">
    <div class="container">
      <div class="header-row">
        <h1 class="site-title"><a href="/archive" class="brand">贺去病 · 博客</a></h1>
        <nav class="nav">
          <a href="/archive">归档</a>
          <a href="/tags">标签</a>
          <a href="/about">关于</a>
          <a href="/ai-nav/">AI导航</a>
            <a href="https://www.hequbing.com/">商业咨询</a>
        </nav>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="post-breadcrumb">
      <a href="/archive">← 返回归档</a>
    </div>

    <article id="post" class="post-detail">
      <h2 id="post-title">{{POST_TITLE}}</h2>
      <div class="meta" id="post-meta">{{POST_META}}</div>
      <div id="post-content" class="content">{{POST_CONTENT}}</div>

      <div class="share-bar" id="share-bar">
        <span class="share-label">分享：</span>
        <button class="share-btn" data-share="weibo" title="分享到微博">微博</button>
        <button class="share-btn" data-share="x" title="分享到 X">X</button>
        <button class="share-btn" data-share="copy" title="复制链接">复制链接</button>
      </div>
    </article>

    <nav class="post-nav" id="post-nav"></nav>

    <section class="related-section" id="related-section">
      <h2 class="section-title">相关文章</h2>
      <div id="related-posts" class="related-grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-content">
        <span>© <span id="year"></span> 贺去病 · hequbing.com · 博客</span>
        <div class="footer-links">
          <a href="/archive">归档</a>
          <a href="/tags">标签</a>
          <a href="/about">关于</a>
          <a href="/ai-nav/">AI导航</a>
            <a href="https://www.hequbing.com/">商业咨询</a>
        </div>
      </div>
    </div>
  </footer>

  <script src="/site.js"></script>
  <script src="/post.js"></script>
</body>
</html>
